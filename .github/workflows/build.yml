name: Build Haider IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q HaiderStudio-Source.zip -d source

      - name: Test backend
        working-directory: source/HaiderStudio/backend
        run: node --test

      - name: Build iPhone IPA
        working-directory: source/HaiderStudio
        run: bash scripts/build-unsigned-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HaiderStudio-unsigned-IPA
          path: source/HaiderStudio/build/unsigned/HaiderStudio.ipa
          if-no-files-found: error
